# Does the graph file the ticket correctly and pick the right branch?
# These are the decisions everything downstream depends on, so they are
# asserted deterministically rather than judged.

- name: routing-billing-goes-to-the-knowledge-base
  title: Charged twice this month
  description: My card shows two charges for the same plan. Can you explain?
  expect:
    category: billing
    decision: SearchKnowledgeBase
    used_knowledge_base: true
    blocked: false

# The old version of this asserted a coin flip. "Cannot enable 2FA" reads as
# either account or technical, and either medium or high, and two reasonable
# models disagreed. Being locked out is unambiguous under the stated ladder.
- name: routing-a-locked-out-customer-is-high-priority
  title: Cannot log in at all
  description: >-
    My password reset email never arrives, so I cannot get into my account.
  expect:
    category: account
    priority: high
    used_knowledge_base: true

- name: routing-a-vague-question-still-produces-a-draft
  title: A question
  description: I had a thought about your product.
  expect:
    category: general
    blocked: false
    answer:
      must_not_contain: ["ERROR", "None"]

# The retrieval subgraph: a hit answers from the article, a miss must not loop
# forever. `used_knowledge_base` is the parent's view of it - the attempt count
# stays inside the subgraph, which is the isolation being asserted.
# Asks only the policy. The earlier version added "and want to cancel", which
# is a question and an action request at once - reasonable models split on it,
# so it measured ambiguity rather than routing.
- name: routing-a-documented-question-is-answered-from-the-knowledge-base
  title: What is your refund policy
  description: Where can I read the refund rules for annual plans?
  expect:
    decision: SearchKnowledgeBase
    used_knowledge_base: true
    blocked: false

# Whether nonsense retrieves anything depends on how the refiner broadens the
# query, which differs per model. What must hold is that the run finishes with
# a draft rather than failing.
- name: routing-an-undocumented-question-still-produces-a-draft
  title: Zzzz qqqq
  description: Wwww eeee rrrr tttt.
  expect:
    blocked: false

# The other side of "search before you escalate": a request for a decision
# nobody documented must not be answered by the agent alone. Either branch here
# ends with a person - a tool waits at the gate, an escalation hands the ticket
# over - and which one is the prompt's taste, so both pass. What fails is an
# Answer, which is the agent granting a refund on its own.
- name: routing-a-request-for-a-decision-reaches-a-person
  title: Refund my annual plan
  description: I want a refund for my annual plan, please process it now.
  # A judgement about authority, not a keyword: the scripted model cannot make it.
  provider_required: true
  expect:
    decision: [RunTool, Escalate]
