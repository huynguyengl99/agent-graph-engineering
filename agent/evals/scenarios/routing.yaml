# Does the graph file the ticket correctly and pick the right branch?
# These are the decisions everything downstream depends on, so they are
# asserted deterministically rather than judged.

- name: routing-billing-goes-to-the-knowledge-base
  title: Charged twice this month
  description: My card shows two charges for the same plan. Can you explain?
  expect:
    category: billing
    decision: SearchKnowledgeBase
    used_knowledge_base: true
    blocked: false

- name: routing-account-access-is-high-priority
  title: Cannot enable 2FA
  description: The QR code never appears when I try to turn on two-factor.
  expect:
    category: account
    priority: high
    used_knowledge_base: true

- name: routing-a-vague-question-still-produces-a-draft
  title: A question
  description: I had a thought about your product.
  expect:
    category: general
    blocked: false
    answer:
      must_not_contain: ["ERROR", "None"]

# The retrieval subgraph: a hit answers from the article, a miss must not loop
# forever. `used_knowledge_base` is the parent's view of it - the attempt count
# stays inside the subgraph, which is the isolation being asserted.
- name: routing-a-documented-question-is-answered-from-the-knowledge-base
  title: What is your refund policy
  description: I bought an annual plan last week and want to cancel.
  expect:
    decision: SearchKnowledgeBase
    used_knowledge_base: true
    blocked: false

- name: routing-an-undocumented-question-still-produces-a-draft
  title: Zzzz qqqq
  description: Wwww eeee rrrr tttt.
  expect:
    used_knowledge_base: false
    blocked: false
