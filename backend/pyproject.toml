[project]
name = "backend"
version = "0.1.0"
description = "Django backend: users, tickets, and the ticket event log"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16.0,<4",
    "django-filter>=25.1,<26",
    "channels>=4.2.2,<5",
    "channels-redis>=4.2.1,<5",
    "chanx[channels,client]>=2.11.7,<3",
    "drf-auth-kit>=1.1.3",
    "drf-spectacular>=0.28.0,<1",
    "drf-standardized-errors>=0.15.0,<1",
    "djangorestframework-camel-case>=1.4.2,<2",
    "django-polymorphic>=4.10.5",
    "django-rest-polymorphic>=0.1.10",
    "environs>=14.2.0",
    "dj-database-url>=2.3.0",
    # The observability admin proxies the agent's trace pages over HTTP.
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2.9,<4",
    "django-stubs-ext>=5.2.1",
    "structlog>=25.4.0,<26",
    "django-structlog>=9.1.1,<10",
    "whitenoise>=6.9.0,<7",
    "django-cors-headers>=4.7.0,<5",
    "granian>=2.3.2",
    "drf-nested-routers>=0.94.1",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.8",
    "djangorestframework-stubs[compatible-mypy]>=3.16.5",
    "mypy>=1.19.0",
    "ruff>=0.12.3,<1",
    "pyright>=1.1.403",
    "pytest>=9.0.1,<10",
    "pytest-django>=4.11.1,<5",
    "pytest-cov>=6.2.1,<7",
    "factory-boy>=3.3.3,<4",
    "faker>=37.4.0,<38",
    "daphne>=4.2.1,<5",
    "pytest-xdist>=3.6,<4",
]
