[mypy]
python_version = 3.13
plugins = mypy_django_plugin.main
strict = True
; The package root is this directory, so modules resolve as `helpdesk.*` only.
; Pointing this at `helpdesk` made every file resolvable under two names.
mypy_path = .
explicit_package_bases = True
; These fire only where we call into libraries that ship no annotations
; (factory-boy, channels' database_sync_to_async, django-polymorphic admin).
; Our own code stays strict.
disable_error_code = no-untyped-call, untyped-decorator

[mypy.plugins.django-stubs]
django_settings_module = "helpdesk.config.settings.dev"

[mypy-allauth.*]
ignore_missing_imports = True

[mypy-djangorestframework_camel_case.*]
ignore_missing_imports = True

[mypy-polymorphic.*]
ignore_missing_imports = True

[mypy-rest_polymorphic.*]
ignore_missing_imports = True

[mypy-chanx.*]
ignore_missing_imports = True

[mypy-drf_spectacular.*]
ignore_missing_imports = True

[mypy-drf_standardized_errors.*]
ignore_missing_imports = True

[mypy-environs.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

[mypy-django_structlog.*]
ignore_missing_imports = True

[mypy-corsheaders.*]
ignore_missing_imports = True

[mypy-channels.*]
ignore_missing_imports = True

[mypy-channels_redis.*]
ignore_missing_imports = True

[mypy-auth_kit.*]
ignore_missing_imports = True

; strict mode turns on no_implicit_reexport; these libs re-export freely.
[mypy-factory.*]
ignore_missing_imports = True
implicit_reexport = True

[mypy-rest_framework_nested.*]
ignore_missing_imports = True
implicit_reexport = True

[mypy-django_filters.*]
ignore_missing_imports = True
implicit_reexport = True
